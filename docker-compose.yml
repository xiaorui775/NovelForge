version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: novelforge-postgres
    environment:
      POSTGRES_USER: novelforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novelforge123}
      POSTGRES_DB: novelforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novelforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novelforge-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://novelforge:${DB_PASSWORD:-novelforge123}@postgres:5432/novelforge
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - novelforge-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: novelforge-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - novelforge-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: novelforge-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    networks:
      - novelforge-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  novelforge-network:
    driver: bridge